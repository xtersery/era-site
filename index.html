<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- the browser chrome's first tone: the hero's onyx; then the room on screen (spikes/full/roomTone.ts) -->
    <meta name="theme-color" content="#f3dfba" />
    <!--
      The hero's LCP pictures, fetched with the HTML instead of after the app's
      JS: the onyx (one file, every width) and the emblem the screen will use
      (the same media as its <picture>). AVIF only — a browser without it
      skips these and the <picture> falls back to WebP on its own.
    -->
    <link rel="preload" as="image" type="image/avif" href="/spikes/hero-stone/assets/hero/onyx.avif" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/spikes/hero-stone/assets/hero/emblem@phone.avif" media="(max-width: 1023px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/avif" href="/spikes/hero-stone/assets/hero/emblem.avif" media="(min-width: 1024px)" fetchpriority="high" />

    <title>ЭРА cosmetology — косметология для женщин</title>
    <meta name="description" content="[Описание клиники для поисковых систем — предоставляется клиентом]" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      TODO(perf): when the licensed production faces land in public/fonts, preload
      the two hero faces here (display regular, text book) with
      <link rel="preload" as="font" type="font/woff2" crossorigin>. Development
      fonts come from @fontsource via CSS and are not preloaded on purpose.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!-- The production site: the approved full page (spikes/full/main.tsx). The
         greyscale wireframe that used to mount here is a dev page now:
         /spikes/wireframe/. -->
    <script type="module" src="/spikes/full/main.tsx"></script>
  </body>
</html>
